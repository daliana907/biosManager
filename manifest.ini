name = biosManager
summary = Gestor de firmware UEFI
description = """Permite consultar y modificar opciones de configuración del firmware UEFI en ordenadores Lenovo compatibles directamente desde Windows con NVDA.

Nota técnica: BIOS y UEFI no son lo mismo. La BIOS heredada o emulada (modo CSM) no admite control desde el sistema operativo. Este complemento opera exclusivamente sobre UEFI nativo.

Advertencia de seguridad: Modificar opciones del firmware del equipo (orden de arranque, Secure Boot, TPM, etc.) puede impedir el inicio de Windows o afectar al cifrado de disco. Modifique únicamente los parámetros que conozca."""
author = Daliana
version = 1.11.0
url = https://github.com/daliana907/biosManager
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Versión 1.11.0:
- Seguridad: ajustes delicados bloqueados por diseño (solo lectura) con confirmación previa antes de guardar.
- Respaldo previo del estado y limpieza automática de temporales tras guardar o descartar.
- Reinicio a UEFI con margen de 30 segundos para guardar el trabajo o cancelarlo.
- Contraseña de supervisor protegida: ya no viaja visible y se borra tras su uso.
- Detección del fabricante antes de pedir permisos: en equipos no compatibles avisa sin molestar.
- Ventana sin congelamientos: la lectura de opciones trabaja en segundo plano.

Versión 1.10.4:
- Corrección crítica en la ejecución del backend PowerShell que impedía la lectura de ajustes en Windows 11 debido a la redirección de salida desconectada.
- Optimización sustancial en la lectura de opciones WMI Lenovo (GetBiosSelections) reduciendo a la mitad el tiempo de carga.
- Manejo robusto de colecciones y serialización JSON tanto para listas vacías, de un único elemento como múltiples ajustes.
- Deduplicación automática de ajustes BIOS reportados por el firmware.
- Compatibilidad moderna con wxWidgets 4.2+ (NVDA 2024+) usando IDs de control generados dinámicamente en los submenús.
- Soporte para abrir el editor pulsando Enter en la lista de ajustes de BIOS.
- Compatibilidad completa garantizada tanto en Windows 10 como en Windows 11.

Versión 1.10.1:
- Blindaje en la configuración de la fecha y la hora desde la interfaz gráfica.
- Filtrado riguroso de respuestas WMI deformadas.

Versión 1.10.0:
- Soporte para contraseña de supervisor de BIOS en la ventana de ajustes.
- Conservación de cambios pendientes si la BIOS rechaza la operación.
- Mensaje descriptivo en español cuando se requiere contraseña de supervisor.
- Mayor estabilidad al cerrar la ventana durante la carga de ajustes.
- Reinicio a BIOS más confiable con advertencia de guardado de documentos.
Versión 1.9.1:
- Complemento más ligero al eliminar dependencias internas que no se utilizaban.
- Documentación técnica interna completa de la comunicación con el firmware y los controles de la ventana.
Versión 1.9:
- Se corrigió la edición de fechas para que respete el formato de origen de cada ordenador (con barras o guiones), evitando avisos falsos de cambios al recorrer la lista y asegurando que el equipo acepte la fecha al guardar.
- Validación mejorada al escribir años y meses con el teclado, garantizando que los valores siempre queden dentro de los límites válidos del sistema.
- Soporte para editar opciones del equipo con valores numéricos negativos o automáticos mediante las casillas numéricas habituales.
- Mayor seguridad durante el guardado elevado de parámetros, impidiendo el cierre accidental de la ventana mientras se graban ajustes en el firmware.
- Mensajes informativos más claros y descriptivos en caso de cancelación de permisos o respuestas específicas del sistema.
- Mejoras generales de estabilidad, liberación de recursos y depuración en segundo plano.
Versión 1.8:
- Seguridad reforzada: comprobación estricta de secureMode para anular la inicialización en pantallas seguras de Windows y diálogos UAC.
- Apertura de documentación actualizada según la API oficial gui.openDocumentation() de NVDA.
- Enlace directo de descarga al archivo .nvda-addon en README y documentación.
- Cabeceras de licencia GPLv2 y copyright en todos los módulos.
Versión 1.7:
- Seguridad: detección de pantallas seguras de Windows para anular la carga del plugin en entornos con privilegios elevados.
- Eliminación del atajo predeterminado NVDA+Shift+B para no entrar en conflicto con la orden nativa de batería de NVDA; ahora todos los comandos son libremente asignables en Gestos de entrada.
- Corrección en la auditoría de conflictos para evitar falsos positivos con palabras como 'cambios'.
- Búsqueda en la ventana de ajustes optimizada: filtrado bajo demanda mediante botón o tecla Intro para evitar retrasos de lectura.
- Validación dinámica de fechas según mes y año bisiesto, y soporte ampliado para enteros con signo de 32 bits.
- Limpieza en la cancelación de la ventana sin llamadas innecesarias al sistema, descartando únicamente cambios locales en memoria.
- Cabeceras de licencia GPLv2 y copyright añadidas a todos los módulos.
- Apertura de documentación actualizada según la API oficial de NVDA y advertencias de seguridad ampliadas.
- Integración completa con el registro nativo de NVDA (logHandler.log) y traducción completa.
Versión 1.6:
- Los cambios en la BIOS no llegaban a aplicarse: la orden que se enviaba a Windows estaba mal formada.
- El archivo con la respuesta de la BIOS quedaba en una carpeta que NVDA no siempre podía leer, y la operación parecía fallar sin motivo.
- Al aplicar un cambio se daba por bueno sin comprobarlo. Ahora se vuelve a leer el valor y se informa de si la BIOS lo aceptó o lo rechazó.
- Guardar en la BIOS bloqueaba NVDA hasta terminar. Ahora se hace en segundo plano.
- Al cerrar la ventana con un cambio escrito pero sin aplicar, ese cambio se perdía en silencio. Ahora avisa.
- El orden de arranque se editaba con un desplegable por posición, y se podía repetir un dispositivo y omitir otro sin que nada lo advirtiera.
- Las consultas a la BIOS podían quedarse esperando indefinidamente si el equipo no respondía o si nadie contestaba al aviso de permisos.
- El orden de arranque se edita ahora en una sola lista que se reordena con Alt y las flechas, y al aplicar se resume solo lo que cambió de sitio.
- El editor de opciones separa decidir qué tipo de editor toca de construirlo, y esa decisión tiene pruebas propias.
- Se eliminaron unas 119 líneas de código que ya no se usaba.
- Se corrigieron dos problemas de seguridad: un archivo temporal con nombre predecible y valores que se enviaban a Windows sin escapar.
- Se añadieron 52 comprobaciones automáticas que se ejecutan solas en GitHub con cada cambio.
Versión 1.5:
- Submenú propio en el menú Herramientas de NVDA (Gestor de BIOS y UEFI) para abrir la configuración, la documentación o revisar posibles conflictos.
- Herramienta para comprobar que ningún otro complemento interfiera con este.
- Mejoras internas en el registro de fallos en nvda.log para encontrar errores más fácil.
Versión 1.4:
- Probado y verificado para la versión 2026.2 de NVDA.
Versión 1.3:
- Opción para cambiar el orden de arranque de los discos y dispositivos USB desde una lista desplegable."""


