name = biosManager
summary = Gestor de BIOS y UEFI
description = """Permite ver y modificar opciones de la BIOS y UEFI en ordenadores Lenovo directamente desde Windows con NVDA, sin tener que entrar a ciegas al menú de arranque."""
author = Daliana
version = 1.5
url = https://github.com/daliana907/biosManager
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Versión 1.5:
- Submenú propio en el menú Herramientas de NVDA (Gestor de BIOS y UEFI) para abrir la configuración, la documentación o revisar posibles conflictos.
- Herramienta para comprobar que ningún otro complemento interfiera con este.
- Mejoras internas en el registro de fallos en nvda.log para encontrar errores más fácil.
Versión 1.4:
- Probado y verificado para la versión 2026.2 de NVDA.
Versión 1.3:
- Opción para cambiar el orden de arranque de los discos y dispositivos USB desde una lista desplegable."""
