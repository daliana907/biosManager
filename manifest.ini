name = biosManager
summary = Gestor de BIOS y UEFI
description = """Permite ver y modificar opciones de la BIOS y UEFI en ordenadores Lenovo directamente desde Windows con NVDA, sin tener que entrar a ciegas al menú de arranque."""
author = Daliana
version = 1.7
url = https://github.com/daliana907/biosManager
docFileName = readme.html
minimumNVDAVersion = 2023.1
lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Versión 1.7:
- Seguridad: detección de pantallas seguras de Windows para anular la carga del plugin en entornos con privilegios elevados.
- Eliminación del atajo predeterminado NVDA+Shift+B para no entrar en conflicto con la orden nativa de batería de NVDA; ahora todos los comandos son libremente asignables en Gestos de entrada.
- Corrección en la auditoría de conflictos para evitar falsos positivos con palabras como 'cambios'.
- Búsqueda en la ventana de ajustes optimizada: filtrado bajo demanda mediante botón o tecla Intro para evitar retrasos de lectura.
- Validación dinámica de fechas según mes y año bisiesto, y soporte ampliado para enteros con signo de 32 bits.
- Limpieza en la cancelación de la ventana sin llamadas innecesarias al sistema, descartando únicamente cambios locales en memoria.
- Cabeceras de licencia GPLv2 y copyright añadidas a todos los módulos.
- Apertura de documentación actualizada según la API oficial de NVDA y advertencias de seguridad ampliadas.
- Integración completa con el registro nativo de NVDA (logHandler.log) y traducción completa.
Versión 1.6:
- Los cambios en la BIOS no llegaban a aplicarse: la orden que se enviaba a Windows estaba mal formada.
- El archivo con la respuesta de la BIOS quedaba en una carpeta que NVDA no siempre podía leer, y la operación parecía fallar sin motivo.
- Al aplicar un cambio se daba por bueno sin comprobarlo. Ahora se vuelve a leer el valor y se informa de si la BIOS lo aceptó o lo rechazó.
- Guardar en la BIOS bloqueaba NVDA hasta terminar. Ahora se hace en segundo plano.
- Al cerrar la ventana con un cambio escrito pero sin aplicar, ese cambio se perdía en silencio. Ahora avisa.
- El orden de arranque se editaba con un desplegable por posición, y se podía repetir un dispositivo y omitir otro sin que nada lo advirtiera.
- Las consultas a la BIOS podían quedarse esperando indefinidamente si el equipo no respondía o si nadie contestaba al aviso de permisos.
- El orden de arranque se edita ahora en una sola lista que se reordena con Alt y las flechas, y al aplicar se resume solo lo que cambió de sitio.
- El editor de opciones separa decidir qué tipo de editor toca de construirlo, y esa decisión tiene pruebas propias.
- Se eliminaron unas 119 líneas de código que ya no se usaba.
- Se corrigieron dos problemas de seguridad: un archivo temporal con nombre predecible y valores que se enviaban a Windows sin escapar.
- Se añadieron 52 comprobaciones automáticas que se ejecutan solas en GitHub con cada cambio.
Versión 1.5:
- Submenú propio en el menú Herramientas de NVDA (Gestor de BIOS y UEFI) para abrir la configuración, la documentación o revisar posibles conflictos.
- Herramienta para comprobar que ningún otro complemento interfiera con este.
- Mejoras internas en el registro de fallos en nvda.log para encontrar errores más fácil.
Versión 1.4:
- Probado y verificado para la versión 2026.2 de NVDA.
Versión 1.3:
- Opción para cambiar el orden de arranque de los discos y dispositivos USB desde una lista desplegable."""
